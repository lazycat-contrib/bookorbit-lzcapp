application:
  subdomain: bookorbit
  upstreams:
    - location: /
      backend: http://app:3000/
  injects:
    - id: bookorbit-setup-prefill
      when:
        - /setup*
      do:
        - src: |
            const values = {
              "#setup-username": ctx.params.username,
              "#setup-name": ctx.params.name,
              "#setup-email": ctx.params.email,
              "#setup-password": ctx.params.password,
              "#setup-confirm-password": ctx.params.password,
              "#setup-token": ctx.params.setupToken,
            };
            const setValue = function (input, value) {
              if (!input || typeof value !== "string") return;
              const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
              setter.call(input, value);
              input.dispatchEvent(new Event("input", { bubbles: true }));
              input.dispatchEvent(new Event("change", { bubbles: true }));
            };
            let attempts = 0;
            const timer = setInterval(function () {
              attempts += 1;
              let complete = true;
              Object.entries(values).forEach(function ([selector, value]) {
                const input = document.querySelector(selector);
                if (!input) complete = false;
                else if (!input.value) setValue(input, value);
              });
              if (complete || attempts >= 20) clearInterval(timer);
            }, 300);
          params:
            username: "{{ .U.admin_username }}"
            name: "{{ .U.admin_name }}"
            email: "{{ .U.admin_email }}"
            password: "{{ .U.admin_password }}"
            setupToken: "{{ .U.setup_bootstrap_token }}"
    - id: bookorbit-capture-credentials
      auth_required: false
      on: request
      when:
        - /api/v1/auth/setup
        - /api/v1/auth/login
        - /api/v1/auth/change-password
      do: |
        let payload = null;
        try {
          payload = ctx.body.getJSON();
        } catch {
          payload = null;
        }
        if (!payload || typeof payload !== "object") return;
        const path = String(ctx.request.path || "");
        if (typeof payload.username === "string" && payload.username.length > 0) {
          ctx.flow.set("bookorbit.pending_username", payload.username);
        }
        const password = path.endsWith("/change-password") ? payload.newPassword : payload.password;
        if (typeof password === "string" && password.length > 0) {
          ctx.flow.set("bookorbit.pending_password", password);
        }
    - id: bookorbit-commit-credentials
      auth_required: false
      on: response
      when:
        - /api/v1/auth/setup
        - /api/v1/auth/login
        - /api/v1/auth/change-password
      do: |
        if (ctx.status < 200 || ctx.status >= 300) return;
        const username = ctx.flow.get("bookorbit.pending_username");
        const password = ctx.flow.get("bookorbit.pending_password");
        if (typeof username === "string" && username.length > 0) {
          ctx.persist.set("bookorbit.username", username);
        }
        if (typeof password === "string" && password.length > 0) {
          ctx.persist.set("bookorbit.password", password);
        }
    - id: bookorbit-login-autofill
      when:
        - /login*
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: bookorbit.username
              default: "{{ .U.admin_username }}"
            password:
              $persist: bookorbit.password
              default: "{{ .U.admin_password }}"
            userSelector: "#username"
            passwordSelector: "#password"
services:
  app:
    # upstream: ghcr.io/bookorbit/bookorbit:3.1.0
    image: ghcr.nju.edu.cn/bookorbit/bookorbit:3.1.0
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=bookorbit
      - POSTGRES_PASSWORD={{ stable_secret "postgres_password" }}
      - POSTGRES_DB=bookorbit
      - JWT_SECRET={{ stable_secret "jwt_secret" }}
      - SETUP_BOOTSTRAP_TOKEN={{ .U.setup_bootstrap_token }}
      - APP_URL=https://{{ .S.AppDomain }}
      - CLIENT_URL=https://{{ .S.AppDomain }}
      - TZ={{ .U.timezone }}
      - PUID={{ .U.owner_uid }}
      - PGID={{ .U.owner_uid }}
      - NODE_MAX_OLD_SPACE_SIZE={{ .U.node_max_old_space_size }}
      - BOOK_DOCK_PATH=/books
      - LIBRARY_BROWSE_ROOT=/books
    depends_on:
      - postgres
    tmpfs:
      - /tmp
    binds:
      - /lzcapp/documents/{{ .U.owner_uid }}/books:/books
      - /lzcapp/var/app:/data
  postgres:
    # upstream: pgvector/pgvector:0.8.6-pg18
    image: docker.1ms.run/pgvector/pgvector:0.8.6-pg18
    environment:
      - POSTGRES_USER=bookorbit
      - POSTGRES_PASSWORD={{ stable_secret "postgres_password" }}
      - POSTGRES_DB=bookorbit
      - PGDATA=/var/lib/postgresql/data/pgdata
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
usage: |
  首次打开时，初始化页面会自动填入部署向导设置的管理员资料和初始化令牌；确认后即可创建管理员账号。
  后续登录会自动填入最近一次成功登录或修改后的凭据。书库文件存放在所选用户的私有文稿目录中。

  On first launch, the setup page is prefilled with the administrator details and bootstrap token
  from the deployment wizard. Later logins reuse the credentials from the latest successful setup,
  login, or password change. Library files live in the selected user's private documents directory.
