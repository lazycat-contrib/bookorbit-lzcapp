version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/bookorbit.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: bookorbit

build:
  run_buildscript: false

images:
  - id: bookorbit
    target: service
    service: app
    source: ghcr.io/bookorbit/bookorbit
    channel: stable
    sort: semver
    tag_regex: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: BookOrbit
    summary: "BookOrbit: Your Reading Space"
